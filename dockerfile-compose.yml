version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - /SciAssist/models:/root/.ollama/models
    ports:
      - "11434:11434"
    command: >
      sh -c "ollama serve & 
             sleep 5 && 
             ollama pull qcwind/qwen3-8b-instruct-Q4-K-M:latest && 
             tail -f /dev/null"

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      # Монтируем ту же папку с моделями
      - ./ollama_models:/SciAssist/models
    # Или ждем, пока модель загрузится
    command: >
      sh -c "while ! curl -s http://ollama:11434/api/tags | grep -q qwen; do
               echo 'Ждем загрузки модели...'
               sleep 5
             done
             python app.py"